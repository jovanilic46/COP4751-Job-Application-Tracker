{% extends 'base.html' %}{% block content %}<div class="pagehead"><div><span class="eyebrow">RECORD DETAILS</span><h1>{{ config.title }} · #{{ record[config.pk] }}</h1></div><div class="actions"><a class="btn" href="{{ url_for('edit_record',section=section,record_id=record[config.pk]) }}">Edit record</a><a href="{{ url_for('list_records',section=section) }}">← Back</a></div></div><div class="panel details">{% for key,label,kind,required in config.fields %}<div><span class="muted">{{ label }}</span><p>{{ record[key] if record[key] is not none else '—' }}</p></div>{% endfor %}</div>{% endblock %}
