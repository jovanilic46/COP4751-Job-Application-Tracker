{% extends 'base.html' %}{% block content %}<div class="pagehead"><div><span class="eyebrow">{{ 'EDIT RECORD' if editing else 'NEW RECORD' }}</span><h1>{{ 'Edit' if editing else 'Add' }} {{ section[:-1] if section!='companies' else 'company' }}</h1></div><a class="back" href="{{ url_for('list_records',section=section) }}">← Back to list</a></div><form class="panel formgrid" method="post">{% for key,label,kind,required in config.fields %}<label class="field {% if kind=='textarea' or kind=='json' or kind=='skills' %}wide{% endif %}"><span>{{ label }}{% if required %} *{% endif %}</span>{% set val=record.get(key) %}{% if kind=='textarea' or kind=='json' or kind=='skills' %}<textarea name="{{ key }}" rows="3" placeholder="{{ 'Python, SQL, Flask' if kind=='skills' else '{"notes": "Phone screen"}' if kind=='json' else '' }}">{% if kind=='skills' and val %}{% if val is string %}{{ val }}{% else %}{{ val|join(', ') }}{% endif %}{% elif val %}{{ val if val is string else val|tojson }}{% endif %}</textarea>{% elif kind=='checkbox' %}<input type="checkbox" name="{{ key }}" value="1" {% if val %}checked{% endif %}>{% elif kind=='company' or kind=='job' %}<select name="{{ key }}" {% if required %}required{% endif %}><option value="">Select {{ label|lower }}</option>{% for option in options[kind] %}<option value="{{ option.id }}" {% if val|string==option.id|string %}selected{% endif %}>{{ option.name }}</option>{% endfor %}</select>{% elif kind=='job_type' or kind=='status' %}<select name="{{ key }}" {% if required %}required{% endif %}><option value="">Select {{ label|lower }}</option>{% for option in (types if kind=='job_type' else statuses) %}<option {% if val==option %}selected{% endif %}>{{ option }}</option>{% endfor %}</select>{% else %}<input type="{{ kind }}" name="{{ key }}" value="{{ val if val is not none else '' }}" {% if required %}required{% endif %} {% if kind=='number' %}min="0"{% endif %}></input>{% endif %}</label>{% endfor %}<div class="wide"><button class="btn" type="submit">{{ 'Save changes' if editing else 'Create record' }}</button></div></form>{% endblock %}
